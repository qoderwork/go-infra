name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    name: test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Test all packages
        run: go test ./... -count=1 -race

      - name: Repeat concurrency tests
        run: go test -count=5 ./structured/ ./workerpool/ ./conc/ ./event/ ./queue/ ./lifecycle/ ./hook/

      - name: Coverage ratchet
        run: bash scripts/check-coverage.sh

      - name: Build all packages
        run: go build ./...

      - name: Build license-tool
        run: go build -C cmd/license-tool -v ./...

      - name: Build examples
        run: |
          go build -C examples/http_server -v ./...
          go build -C examples/worker -v ./...
          go build -C examples/license -v ./...

      - name: Vulnerability check
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  api:
    name: api compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@latest

      - name: Check public API against base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: bash scripts/check-api.sh "$BASE_REF"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
